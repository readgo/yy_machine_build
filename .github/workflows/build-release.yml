name: Build Windows Portable & Release

on:
  push:
    tags:
      - 'release-*'
  workflow_dispatch:

permissions:
  contents: write

# 版本号会被写回源码仓，两次构建并行会抢同一行，串行化
concurrency:
  group: release-build
  cancel-in-progress: false

env:
  GITEE_BRANCH: master

jobs:
  build-and-release:
    name: Build & Release Windows Portable
    runs-on: windows-latest

    steps:
      - name: Clone source from Gitee
        shell: pwsh
        env:
          GITEE_USER: ${{ secrets.GITEE_USERNAME }}
          GITEE_PASS: ${{ secrets.GITEE_TOKEN }}
        run: |
          $user = [System.Uri]::EscapeDataString($env:GITEE_USER)
          $pass = [System.Uri]::EscapeDataString($env:GITEE_PASS)
          $url = "https://${user}:${pass}@gitee.com/jing1984/yy_machine.git"
          git clone --branch $env:GITEE_BRANCH $url .

      - name: Clone app-langs (external language resources)
        shell: pwsh
        env:
          GITEE_USER: ${{ secrets.GITEE_USERNAME }}
          GITEE_PASS: ${{ secrets.GITEE_TOKEN }}
        run: |
          $user = [System.Uri]::EscapeDataString($env:GITEE_USER)
          $pass = [System.Uri]::EscapeDataString($env:GITEE_PASS)
          $url = "https://${user}:${pass}@gitee.com/jing1984/app-langs.git"
          git clone --branch master $url ../app-langs

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve app version
        shell: pwsh
        run: |
          # 版本号唯一来源：源码 config/prod.properties 的 app.version.name，不带时间戳
          #   1.0.0 -> 产物 yy-printer-windows-x86_64-v1.0.0.zip
          # 构建成功后由最后的 Bump version 步骤把它 patch+1 写回源码仓，供下次构建使用
          $ref = "${{ github.ref_name }}"
          $propsPath = "apps\appPrinter\config\prod.properties"
          $raw = [System.IO.File]::ReadAllText((Resolve-Path $propsPath))
          $m = [regex]::Match($raw, '(?m)^[ \t]*app\.version\.name[ \t]*=[ \t]*(\S+)')
          if (-not $m.Success) {
            throw "app.version.name not found in $propsPath"
          }
          $appVersion = $m.Groups[1].Value.Trim()

          # 产物命名与 yy-light 统一：yy-light-windows-x86_64-v1.0.64.zip
          $arch = switch ($env:RUNNER_ARCH) {
            'X64'   { 'x86_64' }
            'ARM64' { 'aarch64' }
            default { 'x86_64' }
          }
          $zipName = "yy-printer-windows-$arch-v$appVersion.zip"

          Write-Host "App version resolved: $appVersion (from $propsPath, ref: $ref)"
          Write-Host "Artifact name: $zipName"
          echo "APP_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "ARCH=$arch" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Compose Desktop distribution
        shell: pwsh
        run: |
          # 版本号通过 -Papp.version.name 覆盖 config/prod.properties，
          # 打包后的 BuildConfig.APP_VERSION_NAME 与系统信息页显示的即为此值
          .\gradlew.bat :apps:appPrinter:createDistributable -PbuildEnv=prod "-Papp.version.name=$env:APP_VERSION" --no-daemon

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $appDir = "apps\appPrinter\build\compose\binaries\main\app\YYMachinePrinter"
          Write-Host "=== App directory: $appDir ==="

          # Copy scripts/ to output
          if (Test-Path "scripts") {
            Write-Host "Copying scripts/ ..."
            Copy-Item -Recurse -Force "scripts" "$appDir\scripts"
          } else {
            Write-Host "Warning: scripts/ not found, skipping"
          }

          # Copy app-langs if available (external project)
          $langSource = "..\app-langs\printer"
          if (Test-Path $langSource) {
            Write-Host "Copying app-langs ..."
            New-Item -ItemType Directory -Force -Path "$appDir\lang" | Out-Null
            Copy-Item -Path "$langSource\*.xml" -Destination "$appDir\lang\" -Force
            if (Test-Path "$langSource\languages.json") {
              Copy-Item -Path "$langSource\languages.json" -Destination "$appDir\lang\languages.json" -Force
            }
            Write-Host "app-langs copied"
          } else {
            Write-Host "Warning: app-langs not found, skipping"
          }

          # 写 run.conf 到包根：一行可执行文件名，外部启动器据此决定启动哪个程序
          #   取 appDir 下唯一的 exe（排除卸载器 unins*），改名也不用同步维护
          $exes = @(Get-ChildItem -Path $appDir -Filter *.exe -File | Where-Object { $_.Name -notlike 'unins*' })
          if ($exes.Count -ne 1) {
            throw "Expected exactly 1 launcher exe in $appDir, found $($exes.Count): $($exes.Name -join ', ')"
          }
          $runConfPath = Join-Path $appDir "run.conf"
          [System.IO.File]::WriteAllText($runConfPath, $exes[0].Name + "`r`n", (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "run.conf written: $($exes[0].Name)"

          # ZIP 名在 Resolve app version 步骤已确定（yy-printer-windows-<arch>-v<version>.zip）
          $zipName = $env:ZIP_NAME
          $zipPath = "$appDir\$zipName"
          Write-Host "Creating ZIP: $zipName"
          Compress-Archive -Path "$appDir\*" -DestinationPath $zipPath -Force

          # Set env for later steps
          echo "ZIP_PATH=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "=== ZIP created: $zipPath ==="

      - name: List output contents
        shell: pwsh
        run: |
          Write-Host "=== ZIP file ==="
          Get-Item "$env:ZIP_PATH" | Select-Object Name, Length
          Write-Host "=== Output directory ==="
          Get-ChildItem "apps\appPrinter\build\compose\binaries\main\app\YYMachinePrinter" -Include *.zip | Select-Object Name, Length
          Write-Host "=== run.conf ==="
          Get-Content "apps\appPrinter\build\compose\binaries\main\app\YYMachinePrinter\run.conf" -Raw

      - name: Create GitHub Release
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Write-Host "=== Creating release: $tag (app version: $env:APP_VERSION) ==="
          gh release create "$tag" `
            --repo readgo/yy_machine_build `
            --title "yy-printer v$env:APP_VERSION" `
            --notes "Windows $env:ARCH portable release.`nApp version: $env:APP_VERSION`nBuild tag: $tag" `
            "$env:ZIP_PATH"
        env:
          GH_TOKEN: ${{ github.token }}

      # 只有走到这一步（Release 已建好）才消耗版本号：patch+1 写回源码仓，供下次构建使用
      - name: Bump version in source repo
        shell: pwsh
        env:
          GITEE_USER: ${{ secrets.GITEE_USERNAME }}
          GITEE_PASS: ${{ secrets.GITEE_TOKEN }}
        run: |
          # 让 git 的非零退出码由 $LASTEXITCODE 判断，而不是直接抛异常中断重试
          $PSNativeCommandUseErrorActionPreference = $false
          $propsPath = "apps\appPrinter\config\prod.properties"
          $current = $env:APP_VERSION
          $parts = $current.Split('.')
          if ($parts.Count -ne 3) {
            throw "Version '$current' is not MAJOR.MINOR.PATCH, cannot bump"
          }
          $next = "{0}.{1}.{2}" -f $parts[0], $parts[1], ([int]$parts[2] + 1)

          # 只替换这一行，保留原文件编码（无 BOM）与行尾
          $content = [System.IO.File]::ReadAllText((Resolve-Path $propsPath))
          $updated = [regex]::Replace($content, '(?m)^[ \t]*app\.version\.name[ \t]*=[^\r\n]*', "app.version.name=$next")
          if ($updated -eq $content) {
            throw "Failed to rewrite app.version.name in $propsPath"
          }
          [System.IO.File]::WriteAllText((Resolve-Path $propsPath), $updated, (New-Object System.Text.UTF8Encoding($false)))

          git config user.name  "yy-machine-ci"
          git config user.email "ci@yyvendor.com"
          git add $propsPath
          git commit -m "chore: bump app version to $next (released $current, tag ${{ github.ref_name }})"

          $pushed = $false
          for ($i = 1; $i -le 3; $i++) {
            git pull --rebase origin $env:GITEE_BRANCH
            if ($LASTEXITCODE -ne 0) { git rebase --abort 2>$null }
            git push origin "HEAD:$env:GITEE_BRANCH"
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            Write-Host "push failed (attempt $i), retrying in 5s ..."
            Start-Sleep -Seconds 5
          }
          if (-not $pushed) {
            # 写不回去就标红：否则下次构建还会用同一个版本号，产出同名资产
            throw "Version bump committed locally but push to $env:GITEE_BRANCH failed after 3 attempts. Current version '$current' will be reused by the next build unless fixed."
          }
          Write-Host "Version bumped: $current -> $next (pushed to $env:GITEE_BRANCH)"

      - name: Build Summary
        run: |
          Write-Host "=========================================="
          Write-Host "  Build & Release Complete!"
          Write-Host "  Tag: ${{ github.ref_name }}"
          Write-Host "  App version: $env:APP_VERSION"
          Write-Host "  Asset: $env:ZIP_NAME"
          Write-Host "  Repo: readgo/yy_machine_build"
          Write-Host "=========================================="
        shell: pwsh
